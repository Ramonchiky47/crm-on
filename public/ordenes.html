<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Órdenes · CRM-ON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="contenedor">
    <h1 hidden>Órdenes</h1>

    <nav class="nav-principal" hidden>
      <a href="catalogos.html?tab=contactos">Contactos</a>
      <a href="catalogos.html?tab=destinos">Hotel / Local</a>
    </nav>

    <div class="acciones-form acciones-form-centrado">
      <button type="button" id="btn-mostrar-form" class="btn-agregar">+ Agregar orden</button>
      <button type="button" id="btn-actualizar-ordenes-netsuite" class="btn-mini" title="Sube el/los .xlsx de NetSuite: Vista predeterminada Transacción (actualiza Órdenes) y/o Detalle de órdenes de venta por artículo (actualiza Detalle de compra)">Actualizar</button>
      <input type="file" id="input-actualizar-ordenes-netsuite" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple hidden />
      <div class="chip-select">
        <span class="chip-select-etiqueta">Año</span>
        <select id="filtro-anio"></select>
      </div>
    </div>

    <div id="modal-orden-overlay" class="modal-overlay" hidden>
      <div class="modal-caja modal-caja-ancha" role="dialog" aria-modal="true">
        <button type="button" id="modal-orden-cerrar" class="modal-cerrar" aria-label="Cerrar">✕</button>
        <h2 id="titulo-form-orden">Nueva orden</h2>
        <form id="form-orden" class="detalle-orden">
          <input type="hidden" id="orden-id-original" />

          <div class="tarjeta">
            <h3>Resumen</h3>
            <div class="fila">
              <label>
                ID (único)
                <input type="text" id="id" required />
              </label>
              <label>
                Fecha
                <input type="date" id="fecha" required />
              </label>
              <label>
                Número de OC / cheque
                <input type="text" id="numero_oc" />
              </label>
              <label>
                Estatus
                <select id="estatus_id">
                  <option value="">-- Selecciona --</option>
                </select>
              </label>
            </div>
          </div>

          <div class="tarjeta">
            <h3>Cliente y destino</h3>
            <label>
              Nombre
              <input type="text" id="nombre" />
            </label>
            <div class="fila">
              <label>
                Contacto
                <span class="campo-con-boton">
                  <select id="contacto_id">
                    <option value="">-- Selecciona --</option>
                  </select>
                  <button type="button" id="btn-nuevo-contacto" class="btn-mini" title="Agregar contacto nuevo">+</button>
                </span>
              </label>
              <label>
                Hotel / Local
                <span class="campo-con-boton">
                  <select id="destino_id">
                    <option value="">-- Selecciona --</option>
                  </select>
                  <button type="button" id="btn-nuevo-destino" class="btn-mini" title="Agregar hotel/local nuevo">+</button>
                </span>
              </label>
              <label>
                Estado de la República
                <select id="estado_entrega_id">
                  <option value="">-- Selecciona --</option>
                </select>
              </label>
            </div>
            <p id="pista-asociar-contacto-destino" class="pista" hidden></p>
          </div>

          <div class="tarjeta">
            <h3>Importes</h3>
            <div class="fila">
              <label class="campo-angosto">
                Moneda
                <input type="text" id="moneda" maxlength="5" />
              </label>
              <label>
                Importe (moneda extranjera)
                <input type="number" id="importe_moneda_extranjera" step="0.01" />
              </label>
              <label>
                Importe
                <input type="number" id="importe" step="0.01" />
              </label>
            </div>
          </div>

          <div class="tarjeta">
            <h3>Nota y observaciones</h3>
            <label>
              Nota
              <textarea id="nota" rows="2"></textarea>
            </label>
            <label>
              Observaciones
              <textarea id="observaciones" rows="2"></textarea>
            </label>
          </div>

          <div class="acciones-form">
            <button type="submit" id="btn-guardar">Agregar orden</button>
            <button type="button" id="btn-cancelar">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <div class="busqueda fila-filtros">
      <input type="text" autocomplete="off" id="buscar" placeholder="Buscar por ID, nombre, número de OC, hotel/local o artículo..." />
      <div class="multi-select" id="filtro-estatus-wrap">
        <button type="button" id="filtro-estatus-btn" class="multi-select-btn">Todos los estatus</button>
        <div id="filtro-estatus-panel" class="multi-select-panel" hidden></div>
      </div>
    </div>

    <div class="acciones-form">
      <button type="button" id="btn-enviar-tareas-ordenes" class="btn-mini" disabled>Enviar a tareas (0)</button>
    </div>

    <div class="tabla-scroll">
      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="check-todos-ordenes" title="Seleccionar todos" /></th>
            <th data-campo="id">ID</th>
            <th data-campo="fecha">Fecha</th>
            <th data-campo="estatus_nombre">Estatus</th>
            <th data-campo="importe">Importe</th>
            <th data-campo="destino_nombre">Hotel / Local</th>
            <th data-campo="contacto_nombre">Contacto</th>
            <th data-campo="estado_entrega_nombre">Entrega</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-ordenes"></tbody>
      </table>
    </div>

    <p id="estado-vacio" hidden>No hay órdenes para mostrar.</p>
  </div>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div id="modal-caja" class="modal-caja" role="dialog" aria-modal="true">
      <button type="button" id="modal-cerrar" class="modal-cerrar" aria-label="Cerrar">✕</button>
      <div id="modal-contenido"></div>
    </div>
  </div>

  <div id="modal-rapido-overlay" class="modal-overlay" hidden>
    <div class="modal-caja modal-caja-chica" role="dialog" aria-modal="true">
      <button type="button" id="modal-rapido-cerrar" class="modal-cerrar" aria-label="Cerrar">✕</button>
      <h3 id="modal-rapido-titulo"></h3>
      <form id="form-rapido">
        <label>
          <span id="modal-rapido-etiqueta"></span>
          <input type="text" id="modal-rapido-nombre" required autofocus />
        </label>
        <div class="acciones-form">
          <button type="submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="modal-asociar-overlay" class="modal-overlay" hidden>
    <div class="modal-caja modal-caja-chica" role="dialog" aria-modal="true">
      <button type="button" id="modal-asociar-cerrar" class="modal-cerrar" aria-label="Cerrar">✕</button>
      <h3 id="modal-asociar-titulo"></h3>
      <form id="form-asociar">
        <label>
          <span id="modal-asociar-etiqueta"></span>
          <select id="modal-asociar-select" required></select>
        </label>
        <div class="acciones-form">
          <button type="submit">Asociar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>

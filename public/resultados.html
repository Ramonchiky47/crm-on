<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resultados · CRM-ON</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="contenedor">
    <div class="encabezado-panel">
      <h1>Resultados</h1>
      <div class="filtro-resumen-facturacion">
        <div class="chip-select">
          <span class="chip-select-etiqueta">Año</span>
          <select id="filtro-anio-resultados">
            <option value="">Último cerrado</option>
          </select>
        </div>
        <div class="chip-select">
          <span class="chip-select-etiqueta">Mes</span>
          <select id="filtro-mes-resultados">
            <option value="">Último cerrado</option>
          </select>
        </div>
      </div>
    </div>

    <section class="tarjeta tarjeta-resultado">
      <div class="tarjeta__cabecera">
        <h2 class="tarjeta__titulo">Acumulado del año</h2>
        <span class="tarjeta__subtitulo" id="ytd-periodo"></span>
      </div>
      <div class="resultado-metricas">
        <div class="resultado-metrica">
          <span class="resultado-metrica__etiqueta">Venta</span>
          <span class="resultado-metrica__valor" id="ytd-venta"></span>
        </div>
        <div class="resultado-metrica">
          <span class="resultado-metrica__etiqueta">Presupuesto</span>
          <span class="resultado-metrica__valor" id="ytd-presupuesto"></span>
        </div>
        <div class="resultado-metrica">
          <span class="resultado-metrica__etiqueta">Alcance</span>
          <span class="resultado-metrica__valor" id="ytd-alcance"></span>
        </div>
        <div class="resultado-metrica">
          <span class="resultado-metrica__etiqueta">Diferencia</span>
          <span class="resultado-metrica__valor" id="ytd-diferencia"></span>
        </div>
      </div>
    </section>

    <section class="tarjeta tarjeta-resultado">
      <div class="tarjeta__cabecera">
        <h2 class="tarjeta__titulo">Mes seleccionado</h2>
        <span class="tarjeta__subtitulo" id="mes-periodo"></span>
      </div>
      <div class="resultado-metricas">
        <div class="resultado-metrica">
          <span class="resultado-metrica__etiqueta">Venta</span>
          <span class="resultado-metrica__valor" id="mes-venta"></span>
        </div>
        <div class="resultado-metrica">
          <span class="resultado-metrica__etiqueta">Presupuesto</span>
          <span class="resultado-metrica__valor" id="mes-presupuesto"></span>
        </div>
        <div class="resultado-metrica">
          <span class="resultado-metrica__etiqueta">Alcance</span>
          <span class="resultado-metrica__valor" id="mes-alcance"></span>
        </div>
        <div class="resultado-metrica">
          <span class="resultado-metrica__etiqueta">Diferencia</span>
          <span class="resultado-metrica__valor" id="mes-diferencia"></span>
        </div>
      </div>
    </section>

    <section class="tarjeta tarjeta-resultado grafica-anual" aria-label="Venta vs presupuesto por mes">
      <div class="tarjeta__cabecera">
        <h2 class="tarjeta__titulo">Venta vs presupuesto por mes</h2>
        <span class="tarjeta__subtitulo" id="grafica-anual-periodo"></span>
      </div>
      <div class="grafica-leyenda">
        <span class="grafica-leyenda__item"><span class="grafica-leyenda__punto grafica-leyenda__punto--venta"></span>Venta</span>
        <span class="grafica-leyenda__item"><span class="grafica-leyenda__punto grafica-leyenda__punto--presupuesto"></span>Presupuesto</span>
      </div>
      <div class="grafica-contenedor" id="grafica-anual-contenedor"></div>
    </section>

    <section class="kpis" id="resultados-kpis" aria-label="Indicadores generales" style="margin-top: 1.1rem;"></section>
  </div>

  <script src="auth.js"></script>
  <script src="resultados.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal de Proveedores · GONPAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="contenedor" style="max-width: 900px;">
    <div class="detalle-cotizacion" id="vista-cargando">
      <p class="pista">Cargando…</p>
    </div>

    <div id="vista-portal" hidden>
      <div class="detalle-cotizacion" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.7rem;">
        <div>
          <p class="eyebrow-cot">GONPAL · Portal de Proveedores</p>
          <h2 id="portal-titulo"></h2>
        </div>
        <button type="button" class="btn-secundario" id="btn-logout-proveedor">Cerrar sesión</button>
      </div>

      <div class="detalle-cotizacion" style="margin-top: 1.1rem;">
        <h3>Pendientes de cotizar</h3>
        <p class="pista" id="pendientes-vacio" hidden>No tienes solicitudes pendientes en este momento.</p>
        <div id="lista-pendientes"></div>
      </div>

      <div class="detalle-cotizacion" style="margin-top: 1.1rem;">
        <h3>Ya cotizadas</h3>
        <p class="pista" id="respondidas-vacio" hidden>Todavía no has respondido ninguna solicitud.</p>
        <div id="lista-respondidas"></div>
      </div>
    </div>
  </div>

  <template id="plantilla-solicitud-pendiente">
    <form class="panel-form solicitud-pendiente" style="margin-bottom: 1.1rem;">
      <div class="campo-cot">
        <span class="etiqueta-cot">Hotel / Local</span>
        <p class="valor-cot campo-destino"></p>
      </div>
      <div class="campo-cot">
        <span class="etiqueta-cot">Lugar de entrega</span>
        <p class="valor-cot campo-lugar-entrega"></p>
      </div>
      <div class="tabla-scroll" style="margin-top: 0.7rem;">
        <table>
          <thead>
            <tr><th>Código</th><th>Descripción</th><th>Marca</th><th>Cantidad</th><th>Precio de venta</th><th>Tiempo de entrega</th></tr>
          </thead>
          <tbody class="tabla-items"></tbody>
        </table>
      </div>
      <label style="display: block; margin-top: 0.7rem;">
        <span class="etiqueta-cot" style="display: block; margin-bottom: 0.3rem;">Comentarios (opcional)</span>
        <textarea class="campo-comentarios" rows="2" style="width: 100%; box-sizing: border-box;"></textarea>
      </label>
      <div class="acciones-form" style="margin-top: 0.7rem;">
        <button type="submit" class="btn-mini">Enviar cotización</button>
      </div>
    </form>
  </template>

  <template id="plantilla-item-editable">
    <tr>
      <td class="celda-codigo"></td>
      <td class="celda-descripcion"></td>
      <td class="celda-marca"></td>
      <td class="num celda-cantidad"></td>
      <td><input type="number" class="item-precio-venta" step="0.01" min="0" required /></td>
      <td><input type="text" class="item-tiempo-entrega" placeholder="Ej. 2 a 3 semanas" required /></td>
    </tr>
  </template>

  <template id="plantilla-solicitud-respondida">
    <div class="panel-form" style="margin-bottom: 0.9rem;">
      <div>
        <span class="etiqueta-cot campo-destino"></span>
        <span class="pill-estatus estatus-vigente">Cotizada</span>
      </div>
      <div class="pista campo-resumen-items" style="margin-top: 0.4rem;"></div>
      <div class="pista campo-comentarios-resp" style="margin-top: 0.4rem;"></div>
    </div>
  </template>

  <script src="proveedor-portal.js"></script>
</body>
</html>

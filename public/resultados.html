<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resultados · CRM-ON</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="contenedor">
    <div class="encabezado-panel">
      <h1>Resultados</h1>
      <div class="filtro-resumen-facturacion">
        <div class="chip-select">
          <span class="chip-select-etiqueta">Año</span>
          <select id="filtro-anio-resultados">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="chip-select">
          <span class="chip-select-etiqueta">Mes</span>
          <select id="filtro-mes-resultados">
            <option value="">Todos</option>
          </select>
        </div>
      </div>
    </div>

    <section class="kpis" id="resultados-kpis" aria-label="Indicadores de resultados"></section>
  </div>

  <script src="auth.js"></script>
  <script src="resultados.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel General · CRM-ON</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="contenedor">
    <div class="encabezado-panel">
      <h1>Panel General</h1>
      <div class="fecha-panel" id="panel-fecha"></div>
    </div>

    <section class="tarjeta tarjeta-hoy" id="tarjeta-que-hacer-hoy" aria-label="Qué hacer hoy" hidden>
      <div class="tarjeta__cabecera">
        <h2 class="tarjeta__titulo">Qué hacer hoy</h2>
        <span class="tarjeta__subtitulo" id="que-hacer-hoy-subtitulo"></span>
      </div>
      <div class="lista" id="lista-que-hacer-hoy"></div>
    </section>

    <section class="resumen-periodo" id="resumen-periodo" aria-label="Resumen del periodo" hidden>
      <div class="rango-periodo">
        <div class="rango-periodo__botones" id="rango-botones">
          <button type="button" class="rango-periodo__boton" data-rango="hoy">Hoy</button>
          <button type="button" class="rango-periodo__boton" data-rango="semana">Semana</button>
          <button type="button" class="rango-periodo__boton" data-rango="mes">Mes</button>
          <button type="button" class="rango-periodo__boton" data-rango="personalizado">Personalizado</button>
        </div>
        <div class="rango-periodo__fechas" id="rango-fechas" hidden>
          <input type="date" id="resumen-desde" />
          <input type="date" id="resumen-hasta" />
          <button type="button" class="btn-mini" id="btn-aplicar-rango">Aplicar</button>
        </div>
      </div>
      <p class="rango-periodo__descripcion" id="resumen-descripcion"></p>
      <div class="resumen-cot-dia">
        <div class="resumen-cot-dia__grupo">
          <span class="resumen-cot-dia__etiqueta">Cotizaciones creadas</span>
          <span class="resumen-cot-dia__valor" id="resumen-creadas">0</span>
          <span class="resumen-cot-dia__delta" id="resumen-creadas-delta"></span>
        </div>
        <div class="resumen-cot-dia__grupo es-bueno">
          <span class="resumen-cot-dia__etiqueta">Cotizaciones ganadas</span>
          <span class="resumen-cot-dia__valor" id="resumen-ganadas">0</span>
          <span class="resumen-cot-dia__delta" id="resumen-ganadas-delta"></span>
          <span class="resumen-cot-dia__importe" id="resumen-ganadas-importe"></span>
        </div>
        <div class="resumen-cot-dia__grupo es-critico">
          <span class="resumen-cot-dia__etiqueta">Cotizaciones perdidas</span>
          <span class="resumen-cot-dia__valor" id="resumen-perdidas">0</span>
          <span class="resumen-cot-dia__delta" id="resumen-perdidas-delta"></span>
        </div>
      </div>
    </section>

    <section class="kpis" id="panel-kpis" aria-label="Indicadores clave"></section>

    <div class="cuadricula">
      <div class="columna">
        <section class="tarjeta" id="tarjeta-pipeline" hidden>
          <div class="tarjeta__cabecera">
            <h2 class="tarjeta__titulo">Negocios por etapa</h2>
            <span class="tarjeta__subtitulo" id="pipeline-subtitulo"></span>
          </div>
          <div class="pipeline" id="pipeline-lista"></div>
          <div class="pipeline__leyenda">
            <span class="leyenda__punto" style="--marcador:var(--dato-450)">En curso</span>
            <span class="leyenda__punto" style="--marcador:var(--exito)">Ganado</span>
            <span class="leyenda__punto" style="--marcador:var(--peligro)">Perdido</span>
          </div>
        </section>

        <section class="tarjeta" id="tarjeta-vencidas" hidden>
          <div class="tarjeta__cabecera">
            <h2 class="tarjeta__titulo">Cotizaciones vencidas</h2>
            <span class="tarjeta__subtitulo">Requieren mantenimiento</span>
          </div>
          <div class="lista" id="lista-vencidas"></div>
        </section>

        <section class="tarjeta" id="tarjeta-vencer" hidden>
          <div class="tarjeta__cabecera">
            <h2 class="tarjeta__titulo">Cotizaciones por vencer</h2>
            <span class="tarjeta__subtitulo">Próximos 14 días</span>
          </div>
          <div class="lista" id="lista-vencer"></div>
        </section>
      </div>

      <div class="columna">
        <section class="tarjeta" id="tarjeta-tareas" hidden>
          <div class="tarjeta__cabecera">
            <h2 class="tarjeta__titulo">Tareas de hoy</h2>
            <span class="tarjeta__subtitulo" id="tareas-subtitulo"></span>
          </div>
          <div class="lista" id="lista-tareas"></div>
        </section>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="panel.js"></script>
</body>
</html>
